<style>

:root{
  --bg:#0c1714; --panel:#15241f; --line:#25392f; --fg:#e8f2ec; --muted:#8ea79a; --accent:#ffd23f;
  --display:"Lilita One", system-ui, sans-serif; --body:"Nunito", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-direction:column;gap:8px;padding-block:10px 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.tabs::-webkit-scrollbar{display:none}
.tab,.btn{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:800 14px var(--body);padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--accent);color:#1d1600;border-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;line-height:1.35;flex:1;min-width:0}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding-bottom:10px}
#kit{flex:1;min-height:0;overflow-y:auto;padding-bottom:16px;display:flex;flex-direction:column;gap:12px}
#kitlist{display:flex;flex-direction:column;gap:14px}
.kitcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kitcard h2{margin:0;font:400 20px var(--display);color:var(--accent);letter-spacing:.02em}
.kitcard p{margin:0;color:var(--muted);font-size:13px}
.kitcard img{width:100%;height:auto;border-radius:10px;display:block}
.btn[aria-pressed="false"]{opacity:.5}
canvas{display:block;border-radius:14px;background:#000;box-shadow:0 0 0 1px var(--line)}
</style>

    e(x,y,rx,ry,f,lw=6,rot=0){g.beginPath();g.ellipse(x,y,rx,ry,rot,0,Math.PI*2);g.fillStyle=f;g.fill();if(lw){g.lineWidth=lw;g.strokeStyle=OL;g.stroke()}},

    curve(x0,y0,cx,cy,x1,y1,w=6,col=OL){g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo(cx,cy,x1,y1);g.lineWidth=w;g.strokeStyle=col;g.stroke()},

   for(const s of[-1,1]){H.poly([s*76,-10,s*44,-4,s*76,4],'#1d1a1a',0);H.poly([s*74,18,s*48,20,s*72,30],'#1d1a1a',0)}

const SPR={};for(const k in HEADS)SPR[k]=mkHead(HEADS[k]);

const rnd=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=n=>shuffle(ANIMALS.slice()).slice(0,n);
const hpCol=f=>f>.5?'#4cd964':f>.25?'#ffcc00':'#ff3b30';

function txt(s,x,y,size,color='#fff',align='center',stroke=true){
  ctx.font=`${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=size*.16;ctx.lineJoin='round';ctx.strokeStyle='rgba(0,0,0,.85)';ctx.strokeText(s,x,y)}
  ctx.fillStyle=color;ctx.fillText(s,x,y);
}
function emoji(e,x,y,size){if(SPR[e]){const d=size*1.25;ctx.drawImage(SPR[e],x-d/2,y-d/2,d,d);return}ctx.font=`${size}px ${EFONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(e,x,y+size*.06)}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function hpBar(x,y,w,h,f,col){ctx.fillStyle='rgba(0,0,0,.65)';rr(x,y,w,h,h/2);ctx.fill();ctx.fillStyle=col;rr(x,y,w*Math.max(0,Math.min(1,f)),h,h/2);ctx.fill()}
function ball(b){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fillStyle='#1b2622';ctx.fill();const d=b.r*2.05;ctx.drawImage(SPR[b.e],b.x-d/2,b.y-d/2,d,d);ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.lineWidth=b.r*.14;ctx.strokeStyle=b.c;ctx.stroke()}
function bg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#14463a');g.addColorStop(1,'#08120f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function header(t,s){txt(t,W/2,165,92,'#ffd23f');if(s)txt(s,W/2,262,46,'#e8f2ec')}

function collide(a,b,rest=1){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;if(d>=min||d===0)return false;
  const nx=dx/d,ny=dy/d,ma=a.m||1,mb=b.m||1,ov=min-d,s=ma+mb;
  a.x-=nx*ov*mb/s;a.y-=ny*ov*mb/s;b.x+=nx*ov*ma/s;b.y+=ny*ov*ma/s;
  const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(rv<0){const j=-(1+rest)*rv/(1/ma+1/mb);a.vx-=j*nx/ma;a.vy-=j*ny/ma;b.vx+=j*nx/mb;b.vy+=j*ny/mb}
  return true;
}
function walls(b,x0,y0,x1,y1){
  if(b.x-b.r<x0){b.x=x0+b.r;b.vx=Math.abs(b.vx)}if(b.x+b.r>x1){b.x=x1-b.r;b.vx=-Math.abs(b.vx)}
  if(b.y-b.r<y0){b.y=y0+b.r;b.vy=Math.abs(b.vy)}if(b.y+b.r>y1){b.y=y1-b.r;b.vy=-Math.abs(b.vy)}
}
function setSpeed(b,s){const v=Math.hypot(b.vx,b.vy)||1;b.vx*=s/v;b.vy*=s/v}
function randVel(b,s){const d=rnd(0,Math.PI*2);b.vx=Math.cos(d)*s;b.vy=Math.sin(d)*s}

/* effets */
let FX=[];
function burst(x,y,c,n=20){for(let i=0;i<n;i++){const a=rnd(0,7),s=rnd(150,650);FX.push({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:rnd(.4,.9),c})}}
function floatT(s,x,y,c,size=46){x=Math.max(200,Math.min(880,x));FX.push({k:'t',s,x,y,t:0,life:1.1,c,size})}
function fxUpdate(dt){for(const f of FX){f.t+=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.95;f.vy*=.95}else f.y-=90*dt}FX=FX.filter(f=>f.t<f.life)}
function fxDraw(){for(const f of FX){const a=Math.max(0,1-f.t/f.life);ctx.globalAlpha=a;if(f.k==='p'){ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,9*a+2,0,7);ctx.fill()}else txt(f.s,f.x,f.y,f.size,f.c)}ctx.globalAlpha=1}

const G={};

      txt(fmt(b),985,y+22,36,b===danger?'#ff6b6b':'#fff','right')}

    ctx.globalAlpha=1});
}
